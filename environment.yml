name: lite-aigc-detect
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - pillow>=9.5
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - tqdm>=4.66
  - pip:
      - -r requirements.txt
# For GPU training/eval on the original stack, install a matching PyTorch+CUDA
# wheel separately (paper experiments used PyTorch 2.3 + CUDA 12.1).
# Table rebuild from frozen predictions does NOT require a GPU.
